[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-bench"
version = "0.1.0"
description = "Reproducible benchmark for open Vision-Language-Action models on sim tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhi Das" }]
keywords = ["vla", "robotics", "benchmark", "evaluation", "open-world"]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
real = [
    # Installed only when running real models. Heavy; skipped in CI.
    "torch>=2.3",
    "transformers>=4.45,<5.0",  # OpenVLA-OFT uses AutoModelForVision2Seq (renamed in 5.0)
    "accelerate>=0.34",
    "Pillow>=10.0",
    "timm>=0.9.10,<1.0",  # OpenVLA-OFT modeling_prismatic.py hardcodes this range
    "lerobot>=0.3",  # Pi0.5 via Physical Intelligence / HuggingFace LeRobot
    # NOTE: OpenVLA-OFT's modeling_prismatic.py imports `prismatic` from the
    # openvla-oft repo. Do NOT pip-install that repo — its setup.py pins
    # torch==2.2.0 and tensorflow==2.15.0 which fight Colab/modern stacks.
    # Instead, clone the repo as a sibling and add to PYTHONPATH (see Colab notebook).
]

[project.scripts]
vla-bench = "vla_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
