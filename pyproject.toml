[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-bench"
version = "0.1.0"
description = "Reproducible benchmark for open Vision-Language-Action models on sim tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhi Das" }]
keywords = ["vla", "robotics", "benchmark", "evaluation", "open-world"]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
real = [
    # Installed only when running real models. Heavy; skipped in CI.
    "torch>=2.3",
    "transformers>=4.45,<5.0",  # OpenVLA-OFT uses AutoModelForVision2Seq (renamed in 5.0)
    "accelerate>=0.34",
    "Pillow>=10.0",
    "lerobot>=0.3",  # Pi0.5 via Physical Intelligence / HuggingFace LeRobot
    # OpenVLA-OFT's modeling_prismatic.py imports `prismatic`; ships with the OFT repo.
    "openvla-oft @ git+https://github.com/moojink/openvla-oft.git",
]

[project.scripts]
vla-bench = "vla_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
