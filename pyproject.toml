[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-bench"
version = "0.1.0"
description = "Reproducible benchmark for open Vision-Language-Action models on sim tasks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Abhi Das" }]
keywords = ["vla", "robotics", "benchmark", "evaluation", "open-world"]

dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
real = [
    # Installed only when running real models. Heavy; skipped in CI.
    "torch>=2.3",
    "transformers>=4.45",
    "accelerate>=0.34",
    "bitsandbytes>=0.43",  # 4-bit quantization for OpenVLA
]

[project.scripts]
vla-bench = "vla_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
